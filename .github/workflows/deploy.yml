# Build the Next.js app as a static site and deploy to GitHub Pages.
#
# Trigger: every push to main (or master).
# Output:  https://<user>.github.io/<repo-name>/

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure Next.js for GitHub Pages
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          cat > next.config.ts <<EOF
          import type { NextConfig } from "next";

          const REPO_NAME = "${REPO_NAME}";

          const nextConfig: NextConfig = {
            output: "export",
            images: { unoptimized: true },
            basePath: REPO_NAME ? "/${REPO_NAME}" : "",
            assetPrefix: REPO_NAME ? "/${REPO_NAME}/" : "",
            reactStrictMode: false,
            typescript: { ignoreBuildErrors: true },
          };

          export default nextConfig;
          EOF

      - name: Build static site
        run: bun run build:static

      - name: Add .nojekyll
        run: touch ./out/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
